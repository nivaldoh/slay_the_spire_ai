[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spire-agent"
version = "0.1.0"
description = "Reproducible Slay the Spire policy experiments"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.13.0"]
llm = [
    "torch==2.13.0",
    "transformers==5.19.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
]

[tool.uv]
conflicts = [[{ extra = "train" }, { extra = "llm" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "train" },
    { index = "pytorch-cu130", extra = "llm" },
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gameai", "src/spire", "src/twwarhammer3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests share fixtures by importing test modules across these directories.
pythonpath = ["tests", "tests/engine", "tests/combat", "tests/ppo", "tests/language", "tests/fullrun", "tests/twwarhammer3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
