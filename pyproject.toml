[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "game-agents"
version = "0.1.0"
description = "AI players for Slay the Spire and Total War: WARHAMMER III, driven through the original games"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
report = ["Pillow>=11,<13"]
train = ["torch==2.13.0"]
llm = [
    "torch==2.13.0",
    "transformers==5.19.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
]

[tool.uv]
conflicts = [[{ extra = "train" }, { extra = "llm" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "train" },
    { index = "pytorch-cu130", extra = "llm" },
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gameai", "src/spire", "src/twwarhammer3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test modules import each other: a module's own directory is always importable, and
# full-run and language tests also import fixtures from tests/ and tests/combat.
pythonpath = ["tests", "tests/combat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
# Byte-stable: evidence tools compare their hashes and syntax trees with recorded sources.
exclude = ["src/spire/protocol.py", "src/spire/policies.py"]
