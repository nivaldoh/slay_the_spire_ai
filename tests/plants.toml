# Planted wrong versions the named tests must catch (docs/workflow.md, "Checks of checks").
# Each is a plausible wrong implementation of what `guards` names: `old` (exactly once in
# `file`) becomes `new`, and some test in `tests` must then fail. `uv run --locked python
# scripts/check.py --plants` replays them all in a scratch worktree at HEAD; a MISSED line means
# the tests no longer catch what they once did (decay). Run it before an agreed check or a guarded
# file changes, and after a model upgrade. tests/test_check_script.py fails when a plant's
# `old` text is gone: update it to the same wrong version of the new code. Removing or weakening a plant
# needs the owner's yes (check.py lists it).
# A plant whose tests read saved evidence lists it as `evidence` (paths under runs/); --plants
# copies those from the main checkout into its scratch worktree.

