# The exit gate, scripts/check.py, on GitHub for each push to main and each pull request
# (docs/workflow.md). Actions are pinned by commit, uv by version; Python comes from
# .python-version. The suite needs no game, key or network beyond the package install.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py
