   Each tab names the commit its claims were checked at. A ref is "path:line" or
   "path:first-last" at that commit (the page links it on GitHub), or a path under runs/,
   which is local evidence and not in Git.

   status: a string that starts with one of
     "agreed live check", "agreed offline check" (from docs/agreed-checks.md, the WH3 log or
       runs/checks/agreed-passes.jsonl; only revisions in the tab commit's history),
     "built, component tests only", "built, unverified",
     "planned" (names the page and section that plans it),
     "outside our code" (names the doc line that describes it);
   or an object {text, refs, rests} when the status needs its own sources.
   rests: [{file, line, name, sure}]: a value or rule here sits under a marked judgement call
     in that file; the page shows it as "rests on" that marker. sure: false for a marker the
     agent was unsure counts (written with a question mark).
   opensTabs: clicking a box with a `tab` opens that tab, and the panel lists every box's
     status and sources. A flow with loop: true wraps around; autoplay: true starts it on open
     (unless the viewer asked for reduced motion).
   banner: a sentence shown above a tab's canvas. A flow's own rests cover the values in its
     `drawn` text.
   kind sets a box's shape: process, thread, agent, file, outside service, human.
   where sets its background band. only: "<variant>" shows an item only in flows of that
     variant; variants: {<variant>: {...}} replaces fields in flows of that variant.
   A flow's steps run on one clock (battle milliseconds unless the flow says otherwise).
     A step is active while at <= t < until. dots: each entry is a path of wire ids (or
     {path, who, fail}); "~id" runs that wire backwards; the dot crosses the path once over
     the step, or once every `every` ms. box: the box is busy during the step. who: "A" or
     "B", the member whose colour the dot or box takes. fail: true (on a dot or a step) draws
     a hollow red dot: a request that fails.
   lanes: rows, then items: {row, label, who, from, to} for a request, or {row, label, input,
     completed, sent, applied} for a member call (thinking, waiting to be sent, sent until the
     engine applied it; null: not reached, its bar runs to `until` or the flow's end);
     marks: {row, kind, at}. legend: a sentence that replaces the team legend under the lanes,
     for flows whose bars mean something else.

   The tabs above are the two of 2026-10-31 still drawn (FROZEN in the viewer); each also has
   question, takeaway and area (its map box). The new views
   (docs/how-code-works-plan.md, 2026-11-01) each live in their own file,
   docs/how-code-works-view-<id>.js, as JSON that scripts/check.py reads. A view adds:
     question (its title), takeaway (one sentence), reviewed (the date an agent last
     reviewed every claim), example (an id in DIAGRAM_EXAMPLES, or {made_up: true}),
     facts ({providers, hidden_keys, model_policies, scripted_policies, graph_ops}: lists;
     versions: {name: version}; the values it states, which check.py compares with the code),
     merge: true (parallel wires between the same two boxes are drawn as one).
   Any element, wire or step may carry its own commit, which its refs are read at. An element
   may add code (the code name, drawn small under the plain label), ran: false (never ran in
   the game: striped), state (runs today / built, never run / paused), command, stories (view
   ids) and files (path prefixes: the map box a listed file belongs to). A flow with story:
   true numbers its steps (with timed: true they keep their own times and lanes); a step's
   message and map are {example, key} (or literal {title, text}) and are drawn beside the
   picture.

   The control-methods views (2026-11-01) add, in a view: example as a list of ids (a "real
     battle" badge each); "elements": [] (no boxes: the canvas is hidden and the lanes sit at
     the top); generated: {example, key}, whose {elements, wires} join the view's own before
     drawing (a wire without an id gets "from>to"); under: sentences drawn under the picture;
     cards: {<key>: {where, who, writes, done, status, refs, rests, note, stories}}, a method's
     hand-written card, shown with the generated fields (calls, decisions, view_age, example)
     of the lanes' example when its header row is clicked.
   In a flow: lanes may be {example, key} (its other fields, such as legend, override the
     example's); static: true draws the lanes whole over the flow's start-end, with no time
     cursor, while untimed steps run. A step's rows: [row ids] lights those rows and dims the
     rest; span: [from, to] shades that battle time behind them.
   In lanes: columns: true splits the strip into Before | During | Between, and only During
     is the clock. A row may add header: true (a bold line across: label, code, badges: [example
     ids], card: a key in cards), who: "A", "B" or "model" (the colour of its bars, ticks and
     marks) and empty (grey words across an empty lane). An item may add text (drawn inside
     its bar when it fits, else just outside it on its left; label is the tooltip) and kind:
     "wait" (one wait for a model; who "model" draws it purple) or "skill" (a skill step still
     running, in the member's tint). ticks: [{row, at: [ms], who, label, text}]: steps that
     finished at once (label is each tick's tooltip; text, or label when there is none, is
     drawn once over the group when it fits between its first and last tick). marks add kind
     "new" (filled diamond) and "resent" (open square: the same orders sent again), in the who
     colour, with titles: [a tooltip per at]. cells: [{row, column: "before" | "between",
     blocks: [{label, title}], text}]: one equal-width purple block per model call (not to
     scale) with its text wrapped under them, or grey words saying why the cell is empty; the
     row grows to hold them.
   who: "model" also draws a busy box, a dot or a step's border in the model colour.

   The redesign (2026-11-01) adds: on a map wire, rate: {kind: "second" | "seconds" | "battle"
     | "job", short (drawn under its label), text (the panel's "How often")}, which sends teal
     dots along it (RATES in the viewer); in a flow, replay: an id in DIAGRAM_EXAMPLES written
     by scripts/diagram_examples.py replay (its steps, lanes and bookmarks are built from it)
     and speeds: [the speed menu's choices]. NAV in the viewer groups the views in the bar. */

  font: 500 12px var(--sans);
  text-align: left;
}
#locator:hover {
  border-color: var(--signal);
  color: var(--ink);
}
#locator svg {
  width: 132px;
  height: auto;
  margin-bottom: 2px;
}
#locator b {
  display: block;
  max-width: 132px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink-2);
}
#locator b .more {
  margin-left: 4px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
#locator rect {
  fill: #e9edf0;
}
#locator rect.here {
  fill: var(--signal);
}
#locator rect.band {
  fill: none;
  stroke: var(--line);
}

svg {
  display: block;
  width: 100%;
  height: auto;
  font-family: var(--sans);
}
#canvas {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
}
/* A 1400-unit drawing shows at about 0.7 scale: these sizes read like the stories' type. */
#canvas.wide .box .label {
  font-size: 18px;
}
#canvas.wide .box .sub {
  font-size: 13.5px;
}
#canvas.wide .wire-label {
  font-size: 14px;
  stroke-width: 5px;
}
#canvas.wide .band text {
  font-size: 16px;
}
.band rect {
  stroke: none;
}
.band text {
  font: 600 13px var(--sans);
  fill: var(--muted);
}
.box {
  cursor: pointer;
}
.box .shape {
  fill: #fff;
  stroke: var(--ink-2);
  stroke-width: 1.3;
}
.box:hover .shape {
  stroke: var(--ink);
}
.box .stripe {
  fill: var(--ink-2);
}
.box .label {
  font: 600 14px var(--sans);
  fill: var(--ink);
  text-anchor: middle;
}
.box .sub {
  font: 11.5px var(--sans);
  fill: var(--ink-2);
  text-anchor: middle;
}
.box .code {
  font: 10.5px var(--mono);
  fill: var(--muted);
  text-anchor: middle;
}
.box .views {
  font: 600 10.5px var(--sans);
  fill: var(--signal);
  text-anchor: end;
}
.box .pip {
  stroke: #fff;
  stroke-width: 1;
}
.box.s-agreed .pip {
  fill: var(--agreed);
}
.box.s-tests .pip {
  fill: var(--tests);
}
.box.s-unverified .pip {
  fill: var(--unverified);
}
.box.s-planned .pip {
  fill: var(--planned);
}
.box.s-outside .pip {
  fill: var(--outside);
}
.box.s-missing .pip {
  fill: var(--missing);
}
.box.s-outside .shape {
  fill: #f8f6fb;
}
.box.s-planned {
  opacity: 0.55;
}
.box.s-planned .shape {
  stroke-dasharray: 6 4;
  fill: #f7f8f8;
}
.box.k-human .shape {
  stroke-width: 2.2;
}
.box.selected .shape {
  stroke: var(--ink);
  stroke-width: 3;
}
.box.busy.who-A .shape {
  stroke: var(--member-a);
  stroke-width: 4;
}
.box.busy.who-B .shape {
  stroke: var(--member-b);
  stroke-width: 4;
}
.box.busy.who-model .shape {
  stroke: var(--model);
  stroke-width: 4;
}
.box.busy .shape {
  fill: #fffbea;
}
.box .nosource {
  font: 600 10px var(--sans);
  fill: var(--missing);
}
.box.unran .shape {
  fill: url(#unran);
}
.box:focus {
  outline: none;
}
.box:focus-visible .shape {
  stroke: var(--signal);
  stroke-width: 3;
}
.wire {
  cursor: pointer;
}
.wire .hit {
  fill: none;
  stroke: transparent;
  stroke-width: 14;
}
.wire .line {
  fill: none;
  stroke: #8d98a3;
  stroke-width: 1.5;
}
.wire:hover .line {
  stroke: var(--ink-2);
}
.wire .line.loop {
  fill: none;
}
.wire.s-planned {
  opacity: 0.55;
}
.wire.s-planned .line {
  stroke: var(--planned);
  stroke-dasharray: 6 4;
}
.wire.s-outside .line {
  stroke: var(--outside);
}
.wire.selected .line {
  stroke: var(--ink);
  stroke-width: 3;
}
.wire.lit .line {
  stroke: var(--ink);
  stroke-width: 4;
}
.wire-label {
  font: 500 11.5px var(--sans);
  fill: var(--ink-2);
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 4px;
  stroke-linejoin: round;
  pointer-events: none;
}
.wire-label .rate {
  font-weight: 400;
  fill: var(--signal);
}
.wire-label.s-planned {
  fill: var(--planned);
}
.dot {
  stroke: #fff;
  stroke-width: 1.5;
  fill: var(--ink);
}
.dot.who-A {
  fill: var(--member-a);
}
.dot.who-B {
  fill: var(--member-b);
}
.dot.who-model {
  fill: var(--model);
}
.dot.fail {
  fill: #fff;
  stroke: var(--missing);
  stroke-width: 3;
}
.box.idle,
.wire.idle,
.wire-label.idle {
  opacity: 0.28;
}
.stream {
  fill: var(--signal);
  stroke: #fff;
  stroke-width: 1.2;
}

/* Under the picture: the shapes it uses, and the planned-parts switch where there are any. */
#key {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
  margin: 6px 2px 0;
  font-size: 13px;
  color: var(--muted);
}
#key:empty {
  display: none;
}
#key span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
#key svg {
  width: 26px;
  height: 14px;
}
#key svg .shape {
  fill: #fff;
  stroke: var(--ink-2);
  stroke-width: 1.2;
}
#key svg .stripe {
  fill: var(--ink-2);
}
#key svg .unran {
  fill: url(#key-unran);
}
#key .switch {
  margin-left: auto;
  font-size: 13px;
}

#player {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 10px 0 8px;
}
#player button,
#player select {
  font: 500 14px var(--sans);
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  padding: 5px 11px;
  cursor: pointer;
}
#player button:hover,
#player select:hover {
  border-color: var(--faint);
}
#player #play {
  min-width: 76px;
  border-color: var(--ink-2);
  font-weight: 600;
}
#player input[type="range"] {
  flex: 1 1 240px;
  accent-color: var(--signal);
}
#player .time {
  font: 13px var(--mono);
  color: var(--ink-2);
  min-width: 120px;
}
#flows {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
#flows button {
  font: 500 14px var(--sans);
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  padding: 4px 11px;
  cursor: pointer;
}
#flows:empty {
  display: none;
}
#flows button[aria-pressed="true"] {
  background: var(--signal-soft);
  border-color: var(--signal);
  font-weight: 600;
}
#pips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-left: 6px;
}
/* a long flow's numbers, smaller so they fit one line */
#pips.many {
  gap: 3px;
}
#player #pips.many button {
  width: 24px;
  height: 24px;
  font-size: 11.5px;
}
#pips:empty {
  display: none;
}
#player #pips button {
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 50%;
  font: 600 12.5px var(--sans);
  color: var(--muted);
}
#player #pips button.seen {
  color: var(--ink);
  border-color: var(--faint);
}
#player #pips button[aria-current="step"] {
  background: var(--signal);
  border-color: var(--signal);
  color: #fff;
}
.keys {
  font-size: 12.5px;
  color: var(--muted);
  margin-left: auto;
}

#lanes {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  cursor: crosshair;
}
.lane-label {
  font: 500 12.5px var(--sans);
  fill: var(--ink-2);
}
.lane-code {
  font: 10.5px var(--mono);
  fill: var(--muted);
}
.lane-rule {
  stroke: var(--line);
  stroke-width: 1;
}
.axis text {
  font: 11px var(--sans);
  fill: var(--muted);
  text-anchor: middle;
}
.axis line {
  stroke: #e6eaee;
}
.bar {
  stroke: #fff;
  stroke-width: 0.5;
}
.bar.req {
  fill: var(--idle);
}
.bar.req.who-A {
  fill: var(--member-a);
  opacity: 0.75;
}
.bar.req.who-B {
  fill: var(--member-b);
  opacity: 0.75;
}
.bar.think.who-A {
  fill: var(--member-a);
}
.bar.think.who-B {
  fill: var(--member-b);
}
.bar.wait.who-A {
  fill: #b9d8ec;
}
.bar.wait.who-B {
  fill: #f2c6a8;
}
.bar.engine {
  fill: #7b868c;
}
.bar.req.who-model {
  fill: var(--model);
  stroke-width: 1.5;
}
.bar.skill {
  fill: #e4e7e9;
  stroke: var(--ink-2);
  stroke-width: 1;
}
.bar.skill.who-A {
  fill: #b9d8ec;
  stroke: var(--member-a);
}
.bar.skill.who-B {
  fill: #f2c6a8;
  stroke: var(--member-b);
}
#lanes.replay .bar.skill {
  stroke: #fff;
  stroke-width: 0.5;
}
.bar-text {
  font: 500 11px var(--sans);
  fill: var(--ink);
  text-anchor: middle;
  pointer-events: none;
}
.label-back {
  fill: #fff;
  pointer-events: none;
}
.bar-text.outside {
  fill: var(--ink-2);
  text-anchor: end;
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 3px;
  stroke-linejoin: round;
}
.tick-text {
  font: 11px var(--sans);
  fill: var(--ink-2);
  text-anchor: middle;
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 4px;
  stroke-linejoin: round;
  pointer-events: none;
}
.mark.resent {
  fill: #fff;
}
.axis .minor {
  stroke: var(--faint);
}
.lane-col {
  font: 600 11.5px var(--sans);
  fill: var(--muted);
  text-anchor: middle;
}
.lane-break {
  font: 600 12px var(--sans);
  fill: var(--faint);
  text-anchor: middle;
}
.lane-who {
  stroke: none;
}
.lane-empty {
  font: italic 11.5px var(--sans);
  fill: var(--muted);
  text-anchor: middle;
}
.lane-header {
  cursor: pointer;
}
.lane-header .bg {
  fill: var(--page);
}
.lane-header .title {
  font: 600 13px var(--sans);
  fill: var(--ink);
}
.lane-header .code {
  font: 10.5px var(--mono);
  fill: var(--muted);
}
.lane-header.selected .bg,
.lane-header:focus-visible .bg {
  stroke: var(--ink);
  stroke-width: 2;
}
.lane-header:focus {
  outline: none;
}
.lane-badge rect {
  fill: #e3f1e8;
}
.lane-badge text {
  font: 600 11px var(--sans);
  fill: #1f5a37;
}
.lane-badge.changed rect {
  fill: #fff3d6;
}
.lane-badge.changed text {
  fill: #6d4c00;
}
.cell-block {
  fill: var(--model);
  stroke: #fff;
  stroke-width: 1;
}
.cell-label {
  font: 600 10.5px var(--sans);
  fill: var(--ink);
  text-anchor: middle;
  pointer-events: none;
}
.cell-text {
  font: 11px var(--sans);
  fill: var(--ink-2);
}
.cell-text.why {
  fill: var(--muted);
}
.lane-row {
  transition: opacity 0.2s;
}
.lane-row.dim {
  opacity: 0.45;
}
#lane-span rect {
  fill: #fff3c4;
  stroke: var(--unverified);
  stroke-width: 1;
  stroke-dasharray: 4 3;
}
.mark {
  stroke: var(--ink-2);
  stroke-width: 1.5;
  fill: none;
}
.mark.discarded {
  stroke: var(--ink);
  fill: #fff;
}
.mark.running {
  fill: var(--ink);
  stroke: none;
}
.bookmark {
  cursor: pointer;
}
.bookmark circle {
  fill: #fff;
  stroke: var(--signal);
  stroke-width: 1.5;
}
.bookmark text {
  font: 600 10px var(--sans);
  fill: var(--signal);
  text-anchor: middle;
}
.bookmark.current circle {
  fill: var(--signal);
}
.bookmark.current text {
  fill: #fff;
}
#cursor {
  stroke: var(--signal);
  stroke-width: 2;
}
#lane-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 13px;
  color: var(--ink-2);
  margin-top: 6px;
}
#lane-legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
#lane-legend svg.swatch {
  width: 18px;
  height: 9px;
  display: inline-block;
}
#under p {
  margin: 4px 0 0;
  color: var(--ink-2);
  font-size: 13.5px;
  max-width: 110ch;
}

/* The side panel: what is happening now, then what was clicked. */
#panel {
  background: var(--page);
  border-left: 1px solid var(--line);
  padding: 18px 20px 28px;
  max-height: 100vh;
  overflow-y: auto;
  position: sticky;
  top: 0;
  align-self: start;
}
#panel h2 {
  font: 600 18px/1.25 var(--sans);
  margin: 2px 0 4px;
}
#panel h3 {
  font: 600 17px/1.3 var(--sans);
  margin: 4px 0 4px;
}
#panel h4 {
  font: 600 13.5px var(--sans);
  color: var(--ink-2);
  margin: 18px 0 4px;
}
#panel p {
  margin: 5px 0;
}
#panel .meta {
  color: var(--muted);
  font-size: 13px;
}
#panel ul {
  margin: 4px 0;
  padding-left: 18px;
}
#panel li {
  margin: 3px 0;
}
#panel .refs {
  font: 12px/1.5 var(--mono);
  padding-left: 0;
  list-style: none;
  word-break: break-all;
}
#panel .refs a {
  color: var(--tests);
}
#panel .refs .local {
  color: var(--ink-2);
}
#panel .status {
  display: flex;
  gap: 7px;
  align-items: baseline;
}
#panel .status .chip {
  flex: none;
  transform: translateY(1px);
}
#panel .badge {
  display: inline-block;
  font: 600 12px var(--sans);
  padding: 1px 7px;
  border-radius: 9px;
  background: #fff3d6;
  color: #6d4c00;
}
#panel .badge.measured {
  background: #e3f1e8;
  color: #1f5a37;
}
#panel .badge.illustrative {
  background: #eceff1;
  color: var(--ink-2);
}
#panel .step {
  border-left: 3px solid var(--line);
  padding: 2px 0 2px 10px;
  margin: 8px 0;
}
#panel .step.who-A {
  border-color: var(--member-a);
}
#panel .step.who-B {
  border-color: var(--member-b);
}
#panel .step.who-model {
  border-color: var(--model);
}
#panel .step .when {
  font: 12px var(--mono);
  color: var(--muted);
}
#panel .rests {
  color: #6d4c00;
  font-size: 13px;
}
#panel .missing {
  color: var(--missing);
  font-weight: 600;
}
#panel .kv {
  color: var(--ink-2);
}
#panel .kv b {
  color: var(--ink);
  font-weight: 600;
}
#panel .hint {
  color: var(--muted);
  font-size: 13.5px;
}
#panel button {
  font: 500 14px var(--sans);
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
}
#panel button:hover {
  border-color: var(--faint);
}
#panel .caption {
  border-left: 3px solid var(--signal);
  padding: 2px 0 4px 12px;
  margin: 0 0 12px;
}
#panel .caption .count {
  font: 500 13px var(--sans);
  color: var(--muted);
}
#panel .caption p {
  font: 500 18px/1.4 var(--sans);
  margin: 2px 0 0;
}
#panel .caption p.rests {
  font: 13px/1.4 var(--sans);
  margin-top: 6px;
}
#panel .caption .member {
  font: 15px/1.4 var(--sans);
  margin: 6px 0 0;
  padding-left: 8px;
  border-left: 3px solid var(--line);
}
#panel .caption .member.who-A {
  border-color: var(--member-a);
}
#panel .caption .member.who-B {
  border-color: var(--member-b);
}
#panel .caption .member .meta {
  font-size: 13px;
}
#panel .story-step {
  margin: 6px 0 10px;
  padding: 8px 10px;
  background: var(--signal-soft);
  border-radius: 6px;
}
#panel .story-step p {
  margin: 4px 0 0;
  font-size: 14px;
}
#panel .message {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 6px;
  margin: 0 0 10px;
}
#panel .message .title {
  font: 600 12px var(--sans);
  color: var(--muted);
  padding: 5px 9px 0;
}
#panel .message pre {
  font: 11.5px/1.45 var(--mono);
  margin: 0;
  padding: 3px 9px 7px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 170px;
  overflow-y: auto;
}
#panel .message.tall pre {
  max-height: 340px;
}
#panel .unitmap {
  margin: 0 0 8px;
}
#panel .unitmap svg {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f6f4ec;
}
#panel .unitmap .note {
  color: var(--muted);
  font-size: 12.5px;
  margin: 3px 0 0;
}
.unit.friendly rect {
  fill: var(--member-a);
}
.unit.enemy rect {
  fill: var(--missing);
}
.unit.routing rect {
  fill: #fff;
  stroke-width: 2;
}
.unit.friendly.routing rect {
  stroke: var(--member-a);
}
.unit.enemy.routing rect {
  stroke: var(--missing);
}
.unit text {
  font: 600 11px var(--sans);
  fill: var(--ink);
  paint-order: stroke;
  stroke: #f6f4ec;
  stroke-width: 3px;
}
.unitmap .order {
  stroke: var(--member-a);
  stroke-width: 1.6;
  stroke-dasharray: 4 3;
  fill: none;
}
.unitmap .trail {
  fill: none;
  stroke-width: 1.4;
  opacity: 0.45;
}
.unitmap .trail.friendly {
  stroke: var(--member-a);
}
.unitmap .trail.enemy {
  stroke: var(--missing);
}
.unitmap .leader {
  stroke: var(--muted);
  stroke-width: 0.75;
}
.unitmap .scale {
  stroke: var(--ink-2);
  stroke-width: 1.5;
}
.unitmap .scale-text {
  font: 10.5px var(--sans);
  fill: var(--ink-2);
}
#panel code {
  font: 12px var(--mono);
}
#panel .files {
  list-style: none;
  padding-left: 0;
  font-size: 13px;
}
#panel .files code {
  font: 11.5px var(--mono);
}
#panel .files li > code:first-child {
  word-break: break-all;
}
#panel .stories {
  margin: 10px 0 6px;
}
#panel .stories b {
  display: block;
  font-weight: 600;
  margin-bottom: 4px;
}
#panel .stories button {
  display: block;
  width: 100%;
  text-align: left;
  margin: 0 0 5px;
  padding: 6px 10px;
}
#panel .stories button span {
  display: block;
  font-size: 13px;
  color: var(--muted);
}
/* The map's timing key: one row per kind of rate, each with its own moving sample. */
#panel .modes {
  display: flex;
  gap: 4px;
  margin: 6px 0 10px;
}
#panel .modes button[aria-pressed="true"] {
  background: var(--signal-soft);
  border-color: var(--signal);
  font-weight: 600;
}
#panel .rates {
  margin: 8px 0 4px;
}
#panel .rate {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 10px;
  align-items: start;
  margin: 0 0 9px;
}
#panel .rate svg {
  width: 70px;
  height: 16px;
  margin-top: 3px;
}
#panel .rate svg line {
  stroke: #8d98a3;
  stroke-width: 1.2;
}
#panel .rate b {
  display: block;
  font-weight: 600;
}
#panel .rate span {
  color: var(--ink-2);
  font-size: 13.5px;
}
#panel .about {
  margin-top: 22px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}
/* A method's card, opened at the panel's top: compact, so it reads whole at 1366x768. */
#panel .card {
  font-size: 13px;
  line-height: 1.3;
}
#panel .card h3 {
  font-size: 15px;
  margin: 2px 0;
}
#panel .card p,
#panel .card ul {

}

}

/* Sources off (the default): no status colours, file references or judgement notes. */
body.sources-off .box .pip,
body.sources-off .box .nosource,

body.sources-off #panel .statuses,

}
@media (max-width: 1100px) {

  }

<body class="sources-off">
<header id="top">
  <a class="home" href="#map">How the WH3 code works</a>
  <nav id="tabs" aria-label="Views"></nav>
  <label class="switch" title="Show status colours, file references and judgement calls">
    <input type="checkbox" id="sources-switch"> Sources
  </label>
</header>
<main>
  <section id="stage">
    <div id="heading">
      <div class="titles">
        <h1 id="question"></h1>
        <p id="takeaway"></p>
        <p id="provenance"></p>
        <div id="flows" role="group" aria-label="What to show"></div>
      </div>
      <button id="locator" type="button" hidden></button>
    </div>
    <svg id="canvas" role="img" aria-label="Diagram"></svg>
    <div id="key"></div>
    <div id="player">
      <button id="back" title="Previous step (left arrow)">&#9664;</button>
      <button id="play" title="Play or pause (space)">Play</button>
      <button id="next" title="Next step (right arrow)">&#9654;</button>
      <span id="pips"></span>
      <select id="speed" title="Speed">
        <option value="0.1">0.1x</option>
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1">1x</option>
      </select>
      <input id="slider" type="range" min="0" max="1" step="10" value="0" aria-label="Time">
      <span class="time" id="time"></span>
    </div>
    <svg id="lanes" aria-label="Lanes"></svg>
    <div id="lane-legend"></div>
    <div id="under"></div>
  </section>
  <aside id="panel" aria-live="polite"></aside>
</main>
<script>
"use strict";
/* The viewer. Techniques are borrowed as ideas, not code:
   - a flow as a list of steps, quadratic wires, play/pause/step keys:
     konraddzbik/architecture-diagram-skill, skills/architecture-diagram/assets/template.html
     (MIT). Its packets ride SMIL <animateMotion> (:1640); here each dot is placed every frame
     with getPointAtLength, which the template uses only to rest a packet at a wire's end (:1687).
   - several dots in flight on one clock, each at (t - sent) / (received - sent) of its path,
     and a time slider that pauses: ongardie/raftscope, script.js:450-453 and 736-756 (ISC-style).
   - lanes, one row per actor, bars for work and white space for idle: the Dask dashboard's
     task stream (docs.dask.org/en/stable/dashboard.html, BSD-3).
   - a source card per element pinned to a commit, an illustrative-or-measured label on each
     flow, links that restore a view, and reduced motion: tt-a1i/archify, README:88, 286-287
     and 434 (Apache-2.0).
   - one short caption per step: The Secret Lives of Data (thesecretlivesofdata.com/raft, MIT).
   - the svg() helper, the time slider and the requestAnimationFrame loop:
     src/twwarhammer3/battle/report_assets/replay.js in this repo. */
const $ = (id) => document.getElementById(id);
const el = (tag, text, className) => {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
};
const svg = (tag, attrs = {}, text) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text != null) node.textContent = text;
  return node;
};
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const STATUSES = [
  ["agreed", /^agreed (live|offline) check/, "agreed check"],
  ["tests", /^built, component tests only/, "built, component tests only"],
  ["unverified", /^built, unverified/, "built, unverified"],
  ["planned", /^planned/, "planned"],
  ["outside", /^outside our code/, "outside our code"],
];
const statusText = (status) =>
  status == null ? "" : typeof status === "string" ? status : status.text;
function statusKind(status) {
  const hit = STATUSES.find(([, pattern]) => pattern.test(statusText(status)));
  return hit ? hit[0] : "missing";
}

const state = {
  tab: null,
  flow: null,
  time: 0,
  playing: false,
  speed: 0.25,
  planned: false,
  sources: false,
  selected: null,
  loop: null,
  lastTick: null,
  nowKey: null,
};
let boxes = {};
let wires = {};
let lines = {};

const tabById = (id) => DIAGRAM.tabs.find((tab) => tab.id === id);
function currentFlow() {
  const flows = state.tab.flows || [];
  return flows.find((flow) => flow.id === state.flow) || flows[0] || null;
}
function variant() {
  const flow = currentFlow();
  return flow ? flow.variant : null;
}
function merged(item) {
  const extra = item.variants && item.variants[variant()];
  return extra ? { ...item, ...extra } : item;
}
function visible(item) {
  if (item.only && item.only !== variant()) return false;
  return state.planned || statusKind(item.status) !== "planned";
}

// Geometry: a wire leaves its box where the line toward its curve's control point crosses the
// box's edge, so wires need no hand-placed anchors.
const centre = (b) => [b.x + b.w / 2, b.y + b.h / 2];
function edge(b, px, py) {
  const [cx, cy] = centre(b);
  const dx = px - cx;
  const dy = py - cy;
  if (!dx && !dy) return [cx, cy];
  const scale = Math.min(
    dx ? b.w / 2 / Math.abs(dx) : Infinity,
    dy ? b.h / 2 / Math.abs(dy) : Infinity,
  );
  return [cx + dx * scale, cy + dy * scale];
}
function wirePath(w) {
  const r = (v) => v.toFixed(1);
  if (w.from === w.to) {
    // A self-loop (a GaP step that stays where it is): a curve above the box's top edge.
    const b = boxes[w.from];
    const cx = b.x + b.w / 2;
    return `M${r(cx - 16)},${b.y} C${r(cx - 34)},${b.y - 40} ${r(cx + 34)},${b.y - 40} ${r(cx + 16)},${b.y}`;
  }
  const [ax, ay] = centre(boxes[w.from]);
  const [bx, by] = centre(boxes[w.to]);
  const length = Math.hypot(bx - ax, by - ay) || 1;
  const bend = w.bend || 0;
  const qx = (ax + bx) / 2 - ((by - ay) / length) * bend;
  const qy = (ay + by) / 2 + ((bx - ax) / length) * bend;
  const [sx, sy] = edge(boxes[w.from], qx, qy);
  const [ex, ey] = edge(boxes[w.to], qx, qy);
  return `M${r(sx)},${r(sy)} Q${r(qx)},${r(qy)} ${r(ex)},${r(ey)}`;
}

function shape(e) {
  const { x, y, w, h } = e;
  if (e.kind === "file") {
    const c = 11;
    return [
      svg("path", {
        class: "shape",
        d: `M${x},${y} H${x + w - c} L${x + w},${y + c} V${y + h} H${x} Z`,
      }),
    ];
  }
  const rx = { agent: 16, "outside service": h / 2, human: h / 2 }[e.kind] ?? 3;
  const parts = [svg("rect", { class: "shape", x, y, width: w, height: h, rx })];
  if (e.kind === "thread")
    parts.push(svg("rect", { class: "stripe", x: x + 1, y: y + 1, width: 5, height: h - 2 }));
  return parts;
}

// A drawing wider than the stories' 1000 units shrinks more to fit, so its type is drawn larger.
const isWide = (tab) => tab.size[0] > 1200;
function drawBox(e) {
  const g = svg("g", {
    class: `box k-${e.kind.replace(/\s+/g, "-")} s-${statusKind(e.status)}${e.ran === false ? " unran" : ""}`,
    "data-id": e.id,
    tabindex: 0,
  });
  g.append(svg("title", {}, `${e.label}: ${e.note || e.sub || ""}`), ...shape(e));
  const cx = e.x + e.w / 2;
  const rows = [
    ["label", e.label],
    ["sub", e.sub],
    ["code", e.code],
  ].filter(([, text]) => text);
  const gap = isWide(state.tab) ? 17 : 14; // a wide drawing's larger type (see #canvas.wide)
  const top = e.y + e.h / 2 - ((rows.length - 1) * gap) / 2 + 4;
  rows.forEach(([kind, text], i) =>
    g.append(svg("text", { class: kind, x: cx, y: top + i * gap }, text)),
  );
  g.append(svg("circle", { class: "pip", cx: e.x + e.w - 9, cy: e.y + 9, r: 4.5 }));
  // On the map, a box that a view explains says how many, under its right corner.
  const views = state.tab.id === "map" ? viewsOf(e).length : 0;
  if (views)
    g.append(
      svg(
        "text",
        { class: "views", x: e.x + e.w - 7, y: e.y + e.h - 6 },
        views === 1 ? "1 view" : `${views} views`,
      ),
    );
  if (!(e.refs || []).length)
    g.append(svg("text", { class: "nosource", x: e.x + 6, y: e.y + e.h + 12 }, "no source"));
  // never ran in the game: its stripes say so, with the key under the picture
  const pick = (event) => {
    event.stopPropagation();
    const opens = state.tab.opensTabs || state.selected === e.id;
    if (e.tab && tabById(e.tab) && opens) openTab(e.tab);
    else select(e.id);
  };
  g.addEventListener("click", pick);
  g.addEventListener("keydown", (event) => {
    if (event.key === "Enter") pick(event);
  });
  return g;
}

function drawCanvas() {
  const tab = state.tab;
  const canvas = $("canvas");
  canvas.replaceChildren();
  canvas.setAttribute("viewBox", `0 0 ${tab.size[0]} ${tab.size[1]}`);
  canvas.classList.toggle("wide", isWide(tab));
  const defs = svg("defs");
  for (const [name, colour] of [
    ["built", "var(--ink-2)"],
    ["planned", "var(--planned)"],
    ["outside", "var(--outside)"],
  ]) {
    const marker = svg("marker", {
      id: `arrow-${name}`,
      viewBox: "0 0 10 10",
      refX: 9,
      refY: 5,
      markerWidth: 7,
      markerHeight: 7,
      orient: "auto-start-reverse",
    });
    const head = svg("path", { d: "M0,1 L9,5 L0,9 Z" });
    head.style.fill = colour;
    marker.append(head);
    defs.append(marker);
  }
  const stripes = svg("pattern", {
    id: "unran",
    width: 8,
    height: 8,
    patternUnits: "userSpaceOnUse",
    patternTransform: "rotate(45)",
  });
  stripes.append(svg("rect", { width: 8, height: 8, fill: "#ffffff" }));
  stripes.append(svg("rect", { width: 3, height: 8, fill: "#e4e7e9" }));
  defs.append(stripes);
  canvas.append(defs);
  for (const band of tab.bands) {
    const g = svg("g", { class: "band" });
    const fill = `var(--band-${band.where.split(" ")[0].toLowerCase()})`;
    const rect = svg("rect", { x: band.x, y: band.y, width: band.w, height: band.h, rx: 4 });
    rect.style.fill = fill;
    g.append(rect);
    g.append(svg("text", { x: band.x + 10, y: band.y + 17 }, band.where));
    canvas.append(g);
  }
  boxes = {};
  wires = {};
  lines = {};
  for (const item of tab.elements) {
    const e = merged(item);
    if (visible(e)) boxes[e.id] = e;
  }
  const wireLayer = svg("g");
  const labelLayer = svg("g");
  const boxLayer = svg("g");
  canvas.append(wireLayer, boxLayer, labelLayer, svg("g", { id: "dots" }));
  const shown = [];
  const byEnds = {};
  for (const item of tab.wires) {
    const w = merged(item);
    if (!visible(w) || !boxes[w.from] || !boxes[w.to]) continue;
    wires[w.id] = w;
    const ends = `${w.from}>${w.to}`;
    if (tab.merge && byEnds[ends]) {
      byEnds[ends].push(w); // a parallel exit: drawn once, its label joined to the first's
      continue;
    }
    byEnds[ends] = [w];
    shown.push(w);
  }
  for (const w of shown) {
    const group = byEnds[`${w.from}>${w.to}`];
    const label = group
      .map((x) => x.label)
      .filter(Boolean)
      .join(" / ");
    const kind = statusKind(w.status);
    const d = wirePath(w);
    const g = svg("g", { class: `wire s-${kind}`, "data-id": w.id });
    const arrow = kind === "planned" || kind === "outside" ? kind : "built";
    const line = svg("path", {
      class: `line${w.from === w.to ? " loop" : ""}`,
      d,
      "marker-end": `url(#arrow-${arrow})`,
    });
    g.append(svg("title", {}, w.payload), svg("path", { class: "hit", d }), line);
    g.addEventListener("click", (event) => {
      event.stopPropagation();
      select(w.id);
    });
    wireLayer.append(g);
    for (const x of group) lines[x.id] = line;
    if (label) {
      const middle = line.getPointAtLength(line.getTotalLength() / 2);
      // A bent wire that runs mostly up or down keeps its label outside its bulge, so two
      // wires bent apart between the same boxes keep their labels apart.
      const [sx, sy] = centre(boxes[w.from]);
      const [ex, ey] = centre(boxes[w.to]);
      const side = Math.sign(middle.x - (sx + ex) / 2);
      const outside = w.bend && Math.abs(ey - sy) > Math.abs(ex - sx) && side;
      const x = outside ? middle.x + side * 6 : middle.x;
      const anchor = outside ? (side > 0 ? "start" : "end") : "middle";
      const text = svg("text", {
        class: `wire-label s-${kind}`,
        "data-wire": w.id,
        x,
        y: middle.y + 4,
        "text-anchor": anchor,
      });
      text.append(svg("tspan", {}, label));
      // the map's wires say how often they carry something, on a second line
      if (rateOf(w) && rateOf(w).short) {
        text.setAttribute("y", middle.y - 2);
        text.append(svg("tspan", { class: "rate", x, dy: 13 }, rateOf(w).short));
      }
      labelLayer.append(text);
    }
  }
  for (const e of Object.values(boxes)) boxLayer.append(drawBox(e));
  // The older views draw every part at once; the parts the current flow never touches fade.
  const flow = currentFlow();
  if (flow && FROZEN.includes(tab.id)) {
    const used = new Set();
    for (const step of flow.steps) {
      if (step.box) used.add(step.box);
      for (const dot of dotsOf(step))
        for (const id of dot.path) {
          const w = wires[id.replace("~", "")];
          if (w) used.add(w.id).add(w.from).add(w.to);
        }
    }
    canvas
      .querySelectorAll(".box, .wire")
      .forEach((node) => node.classList.toggle("idle", !used.has(node.dataset.id)));
    labelLayer.querySelectorAll("text").forEach((text) => {
      const id = text.dataset.wire;
      if (id) text.classList.toggle("idle", !used.has(id));
    });
  }
  canvas.onclick = () => select(null);
  markSelected();
}

// Where a step's dot is: the share of the step that has passed, as RaftScope places a message
// at (now - sendTime) / (recvTime - sendTime); a repeating step restarts every `every` ms.
function progress(step, t) {
  if (step.every) return ((t - step.at) % step.every) / step.every;
  return (t - step.at) / (step.until - step.at);
}
function pointOn(path, share) {
  const i = Math.min(path.length - 1, Math.floor(share * path.length));
  const local = share * path.length - i;
  const backwards = path[i].startsWith("~");
  const line = lines[path[i].replace("~", "")];
  if (!line) return null;
  return line.getPointAtLength((backwards ? 1 - local : local) * line.getTotalLength());
}
const activeSteps = (flow, t) => flow.steps.filter((step) => step.at <= t && t < step.until);
const dotsOf = (step) =>
  (step.dots || []).map((dot) =>
    Array.isArray(dot)
      ? { path: dot, who: step.who, fail: step.fail }
      : { who: step.who, fail: step.fail, ...dot },
  );

function drawDots() {
  const layer = $("dots");
  if (!layer) return;
  layer.replaceChildren();
  document
    .querySelectorAll(".busy, .lit")
    .forEach((node) => node.classList.remove("busy", "lit", "who-A", "who-B", "who-model"));
  const flow = currentFlow();
  if (!flow) return;
  for (const step of activeSteps(flow, state.time)) {
    if (step.box) {
      const box = document.querySelector(`.box[data-id="${step.box}"]`);
      if (box) box.classList.add("busy", `who-${step.who}`);
    }
    for (const dot of dotsOf(step)) {
      if (reducedMotion) {
        for (const id of dot.path)
          document.querySelector(`.wire[data-id="${id.replace("~", "")}"]`)?.classList.add("lit");
        continue;
      }
      const point = pointOn(dot.path, progress(step, state.time));
      const shift = { A: -3, B: 3 }[dot.who] || 0; // two dots on one spot stay visible
      if (point)
        layer.append(
          svg("circle", {
            class: `dot who-${dot.who || "none"}${dot.fail ? " fail" : ""}`,
            cx: point.x + shift,
            cy: point.y + shift,
            r: 7,
          }),
        );
    }
  }
}

// The map's timing. A wire with a rate carries teal dots: one sent every `every` ms, each
// crossing in `travel` ms, so a busy link shows a stream and a rare one a lone dot now and then.
// Not to scale: the real rates run from 0.3 s to hours, the dots from 0.4 s to 16 s. A wire's
// rate may differ under a graph controller (rate.graph); the key switches between the two.
// JUDGEMENT?: Map dot speeds (Claude Code, 2026-11-01, page redesign): five kinds of rate, each
// drawn about 2-3 times slower than the one before. To scale, a battle's dot would come about
// 90 times less often than a model call's (92 calls in 335 s); the map's timing rests on it.
const RATES = {
  fraction: { every: 420, travel: 1500, title: "Several times a second" },
  second: { every: 900, travel: 1500, title: "About every second" },
  seconds: { every: 2600, travel: 1500, title: "Every few seconds" },
  battle: { every: 8000, travel: 1800, title: "Once a battle" },
  job: { every: 16000, travel: 1800, title: "Once a job, or by hand" },
};
const streams = { loop: null, paused: false, mode: "model" };
// a wire's rate under the controller the key shows: a graph controller's own, where it has one
function rateOf(w) {
  if (!w.rate) return null;
  return streams.mode === "graph" && w.rate.graph ? { ...w.rate, ...w.rate.graph } : w.rate;
}
const offsetOf = (id) => [...id].reduce((sum, c) => (sum * 31 + c.charCodeAt(0)) % 100003, 7);
function drawStreams(now) {
  streams.loop = null;
  const layer = $("dots");
  if (!layer || state.tab.id !== "map") return;
  layer.replaceChildren();
  for (const w of Object.values(wires)) {
    const rate = rateOf(w) && RATES[rateOf(w).kind];
    const line = lines[w.id];
    if (!rate || !line) continue;
    const length = line.getTotalLength();
    const t = now + (offsetOf(w.id) % rate.every);
    for (let k = Math.ceil((t - rate.travel) / rate.every); k * rate.every <= t; k++) {
      const share = (t - k * rate.every) / rate.travel;
      if (share < 0 || share >= 1) continue;
      const point = line.getPointAtLength(share * length);
      layer.append(svg("circle", { class: "stream", cx: point.x, cy: point.y, r: 4.5 }));
    }
  }
  if (!streams.paused) streams.loop = requestAnimationFrame(drawStreams);
}
function startStreams() {
  if (streams.loop) cancelAnimationFrame(streams.loop);
  streams.loop = null;
  if (state.tab.id !== "map" || reducedMotion) return;
  streams.loop = requestAnimationFrame(drawStreams);
}

// Lanes: one row per actor along the flow's clock, bars for work and white space for idle.
// With lanes.columns the strip splits into Before | During | Between (the control-methods
// view): only During is a clock; the side columns hold cells, which are not to scale.
const LANE = { left: 150, right: 16, top: 26, row: 28 };
const SIDE = { width: 130, gap: 10, right: 10 }; // a side column, its "//" break, the margin
const COLUMN_TITLES = [
  "BEFORE THE BATTLE",
  "DURING THE BATTLE (battle seconds)",
  "BETWEEN BATTLES",
];
const AXIS_STEPS = [250, 500, 1000, 2000, 5000, 10000, 30000, 60000];
const MINOR_STEPS = { 2000: 1000, 5000: 1000, 10000: 5000, 30000: 10000, 60000: 10000 };
const whoColour = (who) =>
  who === "model" ? "var(--model)" : who ? `var(--member-${who.toLowerCase()})` : "var(--ink)";
const seconds = (ms) => `${(ms / 1000).toFixed(1)} s`;
let laneRows = {}; // row id: [y, height] of the lanes drawn now
// The x range and battle window of the clock; a static flow keeps the window it was given.
// The lanes of a wide view are drawn 1000 units wide, so their type matches the other views'.

// A step's rows light those lanes and dim the rest (a header stays lit while a row of its
// group is lit); its span, [from, to] in battle ms, is shaded behind the lit rows: one band per
// run of adjacent lit rows, so no dimmed row or header between them is shaded.
function lightLanes(step) {
  const flow = currentFlow();
  const rows = (flow && flow.lanes && flow.lanes.rows) || [];
  const lit = new Set((step && step.rows) || []);
  let header = null;
  for (const row of rows) {
    if (row.header) header = row.id;
    else if (lit.has(row.id) && header) lit.add(header);
  }

    .querySelectorAll("#lanes .lane-row")
    .forEach((g) => g.classList.toggle("dim", lit.size > 0 && !lit.has(g.dataset.row)));
  const span = $("lane-span");
  if (!span) return;
  span.replaceChildren();
  if (!step || !step.span) return;

  let run = null;
  for (const row of rows) {
    if (row.header || !laneRows[row.id] || (lit.size && !lit.has(row.id))) {
      run = null;
      continue;
    }
    const [top, height] = laneRows[row.id];
    if (run) run[1] = top + height;
    else runs.push((run = [top, top + height]));

  const [from, to] = step.span.map((t) => laneX(flow, t));
  for (const [top, bottom] of runs)

      svg("rect", { x: from, y: top + 1, width: Math.max(1, to - from), height: bottom - top - 2 }),
    );

function stepTimes(flow) {

  if (flow.loop && t >= flow.end) t = flow.start; // a looping flow has no idle end point
  state.time = Math.max(flow.start, Math.min(flow.end, t));

  $("canvas").style.display = lanesOnly ? "none" : "";
  const under = $("under");
  under.replaceChildren(...[].concat(tab.under || []).map((text) => el("p", text)));
  renderFlows();
  drawCanvas();
  renderKey();
  drawLanes();
  renderPanel();
  writeHash();
  startStreams();
  if (flow && flow.autoplay && !reducedMotion) play();
}
// One quiet line under the takeaway: where the example comes from, whether the code changed
// since, and check.py's flags (their reasons are in the panel with Sources on).
function renderProvenance(tab) {
  const line = $("provenance");
  line.replaceChildren();
  const flags = flagsOf(tab);
  const parts = [];
  if (tab.example && tab.example.made_up) parts.push(["Example: made up.", ""]);
  const ids = exampleIds(tab).filter((id) => DIAGRAM_EXAMPLES[id]);
  if (ids.length) {
    const dates = [...new Set(ids.map((id) => DIAGRAM_EXAMPLES[id].date_text))];
    const what = ids.length === 1 ? "a real battle" : `${ids.length} real battles`;
    parts.push([`Example: ${what}, ${dates.join(" and ")}.`, ""]);
    const changed = exampleBadges(ids, (flags && flags.example_changed) || []).find((b) => b.changed);
    if (changed) parts.push(["The code has changed since.", "sources", changed.title]);
  }
  if (tab.banner) parts.push([tab.banner, ""]);
  if (flags && flags.flagged) {
    const n = flags.reasons.length;
    parts.push([
      `Out of date: check.py flagged ${n} ${n === 1 ? "change" : "changes"} on ${day(DIAGRAM_FLAGS.date)}.`,
      "warn",
      flags.reasons.join("\n"),
    ]);
  }
  for (const [text, className, title] of parts) {
    const span = el("span", text, className);
    if (title) span.title = title;
    line.append(span);
  }
}
const MONTHS = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
const day = (iso) => `${Number(iso.slice(8, 10))} ${MONTHS[Number(iso.slice(5, 7)) - 1]}`;
function currentStepIndex() {
  const flow = currentFlow();
  if (!flow) return 0;
  let index = 0;
  stepTimes(flow).forEach((t, i) => {
    if (t <= state.time) index = i;
  });
  return index;
}
function writeHash() {
  if (!state.tab) return;
  const flow = currentFlow();
  let hash = `#${state.tab.id}`;
  if (flow) {
    const times = stepTimes(flow);
    let index = 0;
    times.forEach((t, i) => {
      if (t <= state.time) index = i;
    });
    hash += `/${flow.id}/${index}`;
  }
  if (location.hash !== hash) history.replaceState(null, "", hash);
}
function readHash() {
  const [id, flowId, step] = location.hash.slice(1).split("/");
  openTab(id || DIAGRAM.tabs[0].id, flowId, step ? Number(step) : 0);
}

$("play").addEventListener("click", () => (state.playing ? pause() : play()));
$("next").addEventListener("click", () => stepBy(1));
$("back").addEventListener("click", () => stepBy(-1));
$("speed").addEventListener("change", (event) => {
  state.speed = Number(event.target.value);
});
$("slider").addEventListener("input", (event) => {
  if (state.playing) pause();
  setTime(Number(event.target.value));
});
$("slider").addEventListener("change", writeHash);
document.addEventListener("keydown", (event) => {
  if (event.target.closest("input, select, textarea") || !currentFlow()) return;
  if (event.key === " ") {
    event.preventDefault();
    if (state.playing) pause();
    else play();
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    stepBy(1);
  } else if (event.key === "ArrowLeft") {
    event.preventDefault();
    stepBy(-1);
  }

window.addEventListener("hashchange", readHash); // the page's own writes use replaceState
// JUDGEMENT?: Frozen tabs (Claude Code, 2026-11-01, plan decision 1a): the five 2026-10-31
// tabs stay as an appendix that check.py does not flag; each goes once a story replaces it.
// Flagging them would cost a refresh each time their 28 cited files change.
// JUDGEMENT?: Replaced tabs (Claude Code, 2026-11-01, page redesign): Overview, Play loop and
// Team went (at 72e5197 in Git) for the Map's dots and three stories; keeping them keeps their
// scripted, commander and model-team flows. The page's navigation rests on it.
const FROZEN = ["multiplayer", "factory"];
// JUDGEMENT?: GaP drawn in the page (Claude Code, 2026-11-01, control-methods spec): One graph
// battle draws a battle's graphs, generated, hiding unrun steps and untaken exits and listing
// them. Alternatives: graph-view only, or faint untaken exits; the graph story rests on it.
// It replaces the "No GaP view" marker, a change the owner's words of 2026-11-01 allow: "Find a
// good way to represent different army control methods that we will implement. For now we have
// the basic one, and then GaP. We need clean visuals for those too." Codex's graph-view
// (src/twwarhammer3/battle/graph_view.py) stays the full replay of a recorded battle.
const TAB_ORDER = NAV.flatMap((group) => group.items);
const order = (tab) => (TAB_ORDER.includes(tab.id) ? TAB_ORDER.indexOf(tab.id) : TAB_ORDER.length);
DIAGRAM.tabs.sort((a, b) => order(a) - order(b));
// Views made partly by scripts: generated boxes and wires join the hand-written ones (a wire
// without an id gets "from>to"), and a flow's lanes may be {example, key}, whose other fields
// (such as legend) override the example's. A static flow keeps its battle window for the lanes.
for (const tab of DIAGRAM.tabs) {
  tab.elements ??= [];
  tab.wires ??= [];
  tab.bands ??= [];
  tab.size ??= [1000, 0];
  const made = tab.generated && (DIAGRAM_EXAMPLES[tab.generated.example] || {})[tab.generated.key];
  if (made) {
    const ids = new Set([...tab.elements, ...tab.wires].map((item) => item.id));
    const madeWires = (made.wires || []).map((w) => ({ id: `${w.from}>${w.to}`, ...w }));
    tab.elements = [...tab.elements, ...(made.elements || []).filter((e) => !ids.has(e.id))];
    tab.wires = [...tab.wires, ...madeWires.filter((w) => !ids.has(w.id))];
  }
  for (const flow of tab.flows || []) {
    if (flow.lanes && flow.lanes.example) {
      const { example, key, ...extra } = flow.lanes;
      const lanes = (DIAGRAM_EXAMPLES[example] || {})[key];
      flow.lanesExample = example;
      flow.lanes = lanes ? { ...lanes, ...extra } : null;
    }
    if (flow.static) flow.window = [flow.start, flow.end, flow.clock];
  }
}
// A replay flow ({replay: example id}) is a whole recorded graph battle: each step run lights
// its box, the lanes show when each step ran (one row per step) and where each order batch
// left, and the story's steps sit on the time axis as numbered bookmarks.
for (const tab of DIAGRAM.tabs)
  for (const flow of tab.flows || []) {
    if (!flow.replay) continue;
    const data = DIAGRAM_EXAMPLES[flow.replay];
    if (!data) {
      tab.flows = tab.flows.filter((f) => f !== flow); // its data file did not load
      continue;
    }
    const who = Object.fromEntries(data.members.map((m) => [m.id, m.who]));
    const whoOf = (box) => who[box.split(".")[0]];
    const rows = Object.fromEntries(data.rows.map(([id, label, node, skill]) => [id, { label, node, skill }]));
    Object.assign(flow, { data, start: data.start, end: data.end, clock: "battle time" });
    // a run: [box, start, its own end (null: still running), the next step's start, runs, exits]
    flow.steps = data.runs.map(([box, from, done, until, n, exits]) => ({
      at: from,
      until: Math.max(until, from + 1),
      done,
      box,
      who: whoOf(box),
      runs: n,
      exits,
    }));
    const newOrders = {};
    const sameOrders = {};
    for (const [sent, applied, box, text, fresh] of data.orders) {
      const marks = fresh ? newOrders : sameOrders;
      (marks[box] ??= { at: [], titles: [] }).at.push(sent);
      marks[box].titles.push(
        `${seconds(sent)}: ${text}${fresh ? "" : " (the same as before)"}` +
          (applied != null ? `; applied ${seconds(applied)}` : ""),
      );
    }
    flow.lanes = {
      left: 196,
      rows: data.rows.map(([id, label, node]) => ({ id, label, code: node, who: whoOf(id) })),
      items: data.runs.map(([box, from, done, until, n, exits]) => ({
        row: box,
        from,
        to: Math.max(done ?? until, from + 300),
        who: whoOf(box),
        kind: rows[box].skill ? "skill" : "step",
        label: `${rows[box].label}, ${seconds(from)} to ${seconds(done ?? until)}: ${n > 1 ? `${n} runs, ` : ""}${exits}`,
        text: n > 1 ? `${n} runs` : null,
      })),
      marks: [
        ...Object.entries(newOrders).map(([row, m]) => ({ row, kind: "new", ...m })),
        ...Object.entries(sameOrders).map(([row, m]) => ({ row, kind: "sent", ...m })),
      ],
      legend:
        "Bars: each step from its start to its result; a pale bar is a skill step, which runs until the game shows its effect or it gives up. ◆ new orders; tick at the top: the same orders sent again.",
    };
    // the story's steps, at the battle time of each step's map
    const story = tab.flows.find((f) => f.story);
    flow.bookmarks = story
      ? story.steps.map((step, i) => {
          const map = resolve(step.map, "frames");
          return { n: i + 1, at: Math.max(data.start, (map && map.time_ms) || data.start), caption: step.caption };
        })
      : [];
  }
// The two older views' flows step like the stories; their made-up times stay, for the dots
// and the multiplayer lanes, but no clock shows them.
for (const tab of DIAGRAM.tabs)
  if (FROZEN.includes(tab.id))
    for (const flow of tab.flows || []) Object.assign(flow, { story: true, timed: true });
for (const tab of DIAGRAM.tabs)
  for (const flow of tab.flows || [])
    if (flow.story && !flow.timed) {
      flow.steps.forEach((step, i) => Object.assign(step, { at: i * 1000, until: (i + 1) * 1000 }));
      Object.assign(flow, { start: 0, end: flow.steps.length * 1000 - 1, clock: "story steps" });
    }
for (const tab of DIAGRAM.tabs)
  for (const flow of tab.flows || [])
    if (flow.story && flow.timed)
      // a flow ends where its latest step ends (a heartbeat listed early may outlast the last
      // listed step), and its last number stays shown there
      flow.end = Math.min(flow.end, Math.max(...flow.steps.map((step) => step.until)) - 1);
applySwitches();
readHash();

}
