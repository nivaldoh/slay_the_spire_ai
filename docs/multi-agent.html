    claim cites a line at the commit named in the side panel.</p>

    <svg id="canvas" role="img" aria-label="Diagram"></svg>
    <div id="player">
      <span id="flows"></span>

      <button id="play" title="Play or pause (space)">Play</button>
      <button id="next" title="Next step (right arrow)">Step &#9654;</button>

<script>
"use strict";
/* The viewer. Techniques are borrowed as ideas, not code:
   - a flow as a list of steps, quadratic wires, play/pause/step keys:
     konraddzbik/architecture-diagram-skill, skills/architecture-diagram/assets/template.html
     (MIT). Its packets ride SMIL <animateMotion> (:1640); here each dot is placed every frame
     with getPointAtLength, which the template uses only to rest a packet at a wire's end (:1687).
   - several dots in flight on one clock, each at (t - sent) / (received - sent) of its path,
     and a time slider that pauses: ongardie/raftscope, script.js:450-453 and 736-756 (ISC-style).
   - lanes, one row per actor, bars for work and white space for idle: the Dask dashboard's
     task stream (docs.dask.org/en/stable/dashboard.html, BSD-3).
   - a source card per element pinned to a commit, an illustrative-or-measured label on each
     flow, links that restore a view, and reduced motion: tt-a1i/archify, README:88, 286-287
     and 434 (Apache-2.0).
   - one short caption per step: The Secret Lives of Data (thesecretlivesofdata.com/raft, MIT).
   - the svg() helper, the time slider and the requestAnimationFrame loop:
     src/twwarhammer3/battle/report_assets/replay.js in this repo. */
const $ = (id) => document.getElementById(id);
const el = (tag, text, className) => {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
};
const svg = (tag, attrs = {}, text) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text != null) node.textContent = text;
  return node;
};
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const STATUSES = [
  ["agreed", /^agreed (live|offline) check/, "agreed check"],
  ["tests", /^built, component tests only/, "built, component tests only"],
  ["unverified", /^built, unverified/, "built, unverified"],
  ["planned", /^planned/, "planned"],
  ["outside", /^outside our code/, "outside our code"],
];
const statusText = (status) =>
  status == null ? "" : typeof status === "string" ? status : status.text;
function statusKind(status) {
  const hit = STATUSES.find(([, pattern]) => pattern.test(statusText(status)));
  return hit ? hit[0] : "missing";
}

const state = {
  tab: null,
  flow: null,
  time: 0,
  playing: false,
  speed: 0.25,
  planned: true,
  selected: null,
  loop: null,
  lastTick: null,
  nowKey: null,
};
let boxes = {};
let wires = {};
let lines = {};

const tabById = (id) => DIAGRAM.tabs.find((tab) => tab.id === id);
function currentFlow() {
  const flows = state.tab.flows || [];
  return flows.find((flow) => flow.id === state.flow) || flows[0] || null;
}
function variant() {
  const flow = currentFlow();
  return flow ? flow.variant : null;
}
function merged(item) {
  const extra = item.variants && item.variants[variant()];
  return extra ? { ...item, ...extra } : item;
}
function visible(item) {
  if (item.only && item.only !== variant()) return false;
  return state.planned || statusKind(item.status) !== "planned";
}

// Geometry: a wire leaves its box where the line toward its curve's control point crosses the
// box's edge, so wires need no hand-placed anchors.
const centre = (b) => [b.x + b.w / 2, b.y + b.h / 2];
function edge(b, px, py) {
  const [cx, cy] = centre(b);
  const dx = px - cx;
  const dy = py - cy;
  if (!dx && !dy) return [cx, cy];
  const scale = Math.min(
    dx ? b.w / 2 / Math.abs(dx) : Infinity,
    dy ? b.h / 2 / Math.abs(dy) : Infinity,
  );
  return [cx + dx * scale, cy + dy * scale];
}
function wirePath(w) {
  const [ax, ay] = centre(boxes[w.from]);
  const [bx, by] = centre(boxes[w.to]);
  const length = Math.hypot(bx - ax, by - ay) || 1;
  const bend = w.bend || 0;
  const qx = (ax + bx) / 2 - ((by - ay) / length) * bend;
  const qy = (ay + by) / 2 + ((bx - ax) / length) * bend;
  const [sx, sy] = edge(boxes[w.from], qx, qy);
  const [ex, ey] = edge(boxes[w.to], qx, qy);
  const r = (v) => v.toFixed(1);
  return `M${r(sx)},${r(sy)} Q${r(qx)},${r(qy)} ${r(ex)},${r(ey)}`;
}

function shape(e) {
  const { x, y, w, h } = e;
  if (e.kind === "file") {
    const c = 11;
    return [
      svg("path", {
        class: "shape",
        d: `M${x},${y} H${x + w - c} L${x + w},${y + c} V${y + h} H${x} Z`,
      }),
    ];
  }
  const rx = { agent: 16, "outside service": h / 2, human: h / 2 }[e.kind] ?? 3;
  const parts = [svg("rect", { class: "shape", x, y, width: w, height: h, rx })];
  if (e.kind === "thread")
    parts.push(svg("rect", { class: "stripe", x: x + 1, y: y + 1, width: 5, height: h - 2 }));
  return parts;
}

function drawBox(e) {
  const g = svg("g", {
    class: `box k-${e.kind.replace(/\s+/g, "-")} s-${statusKind(e.status)}`,
    "data-id": e.id,
    tabindex: 0,
  });
  g.append(svg("title", {}, `${e.label}: ${e.note || e.sub || ""}`), ...shape(e));
  const cx = e.x + e.w / 2;
  g.append(svg("text", { class: "label", x: cx, y: e.y + e.h / 2 + (e.sub ? -2 : 5) }, e.label));
  if (e.sub) g.append(svg("text", { class: "sub", x: cx, y: e.y + e.h / 2 + 14 }, e.sub));
  g.append(svg("circle", { class: "pip", cx: e.x + e.w - 9, cy: e.y + 9, r: 4.5 }));
  if (!(e.refs || []).length)
    g.append(svg("text", { class: "nosource", x: e.x + 6, y: e.y + e.h + 12 }, "no source"));
  const pick = (event) => {
    event.stopPropagation();
    if (e.tab && tabById(e.tab) && state.selected === e.id) openTab(e.tab);
    else select(e.id);
  };
  g.addEventListener("click", pick);
  g.addEventListener("keydown", (event) => {
    if (event.key === "Enter") pick(event);
  });
  return g;
}

function drawCanvas() {
  const tab = state.tab;
  const canvas = $("canvas");
  canvas.replaceChildren();
  canvas.setAttribute("viewBox", `0 0 ${tab.size[0]} ${tab.size[1]}`);
  const defs = svg("defs");
  for (const [name, colour] of [
    ["built", "var(--ink-2)"],
    ["planned", "var(--planned)"],
    ["outside", "var(--outside)"],
  ]) {
    const marker = svg("marker", {
      id: `arrow-${name}`,
      viewBox: "0 0 10 10",
      refX: 9,
      refY: 5,
      markerWidth: 7,
      markerHeight: 7,
      orient: "auto-start-reverse",
    });
    const head = svg("path", { d: "M0,1 L9,5 L0,9 Z" });
    head.style.fill = colour;
    marker.append(head);
    defs.append(marker);
  }
  canvas.append(defs);
  for (const band of tab.bands) {
    const g = svg("g", { class: "band" });
    const fill = `var(--band-${band.where.split(" ")[0].toLowerCase()})`;
    const rect = svg("rect", { x: band.x, y: band.y, width: band.w, height: band.h, rx: 4 });
    rect.style.fill = fill;
    g.append(rect);
    g.append(svg("text", { x: band.x + 10, y: band.y + 17 }, band.where));
    canvas.append(g);
  }
  boxes = {};
  wires = {};
  lines = {};
  for (const item of tab.elements) {
    const e = merged(item);
    if (visible(e)) boxes[e.id] = e;
  }
  const wireLayer = svg("g");
  const labelLayer = svg("g");
  const boxLayer = svg("g");
  canvas.append(wireLayer, boxLayer, labelLayer, svg("g", { id: "dots" }));
  for (const item of tab.wires) {
    const w = merged(item);
    if (!visible(w) || !boxes[w.from] || !boxes[w.to]) continue;
    wires[w.id] = w;
    const kind = statusKind(w.status);
    const d = wirePath(w);
    const g = svg("g", { class: `wire s-${kind}`, "data-id": w.id });
    const arrow = kind === "planned" || kind === "outside" ? kind : "built";
    const line = svg("path", { class: "line", d, "marker-end": `url(#arrow-${arrow})` });
    g.append(svg("title", {}, w.payload), svg("path", { class: "hit", d }), line);
    g.addEventListener("click", (event) => {
      event.stopPropagation();
      select(w.id);
    });
    wireLayer.append(g);
    lines[w.id] = line;
    if (w.label) {
      const middle = line.getPointAtLength(line.getTotalLength() / 2);
      labelLayer.append(
        svg("text", { class: `wire-label s-${kind}`, x: middle.x, y: middle.y + 4 }, w.label),
      );
    }
  }
  for (const e of Object.values(boxes)) boxLayer.append(drawBox(e));
  canvas.onclick = () => select(null);
  markSelected();
}

// Where a step's dot is: the share of the step that has passed, as RaftScope places a message
// at (now - sendTime) / (recvTime - sendTime); a repeating step restarts every `every` ms.
function progress(step, t) {
  if (step.every) return ((t - step.at) % step.every) / step.every;
  return (t - step.at) / (step.until - step.at);
}
function pointOn(path, share) {
  const i = Math.min(path.length - 1, Math.floor(share * path.length));
  const local = share * path.length - i;
  const backwards = path[i].startsWith("~");
  const line = lines[path[i].replace("~", "")];
  if (!line) return null;
  return line.getPointAtLength((backwards ? 1 - local : local) * line.getTotalLength());
}
const activeSteps = (flow, t) => flow.steps.filter((step) => step.at <= t && t < step.until);
const dotsOf = (step) =>
  (step.dots || []).map((dot) =>
    Array.isArray(dot) ? { path: dot, who: step.who } : { who: step.who, ...dot },
  );

function drawDots() {
  const layer = $("dots");
  if (!layer) return;
  layer.replaceChildren();
  document
    .querySelectorAll(".busy, .lit")
    .forEach((node) => node.classList.remove("busy", "lit", "who-A", "who-B"));
  const flow = currentFlow();
  if (!flow) return;
  for (const step of activeSteps(flow, state.time)) {
    if (step.box) {
      const box = document.querySelector(`.box[data-id="${step.box}"]`);
      if (box) box.classList.add("busy", `who-${step.who}`);
    }
    for (const dot of dotsOf(step)) {
      if (reducedMotion) {
        for (const id of dot.path)
          document.querySelector(`.wire[data-id="${id.replace("~", "")}"]`)?.classList.add("lit");
        continue;
      }
      const point = pointOn(dot.path, progress(step, state.time));
      const shift = { A: -3, B: 3 }[dot.who] || 0; // two dots on one spot stay visible
      if (point)
        layer.append(
          svg("circle", {
            class: `dot who-${dot.who || "none"}`,
            cx: point.x + shift,
            cy: point.y + shift,
            r: 7,
          }),
        );
    }
  }
}

// Lanes: one row per actor along the flow's clock, bars for work and white space for idle.
const LANE = { left: 150, right: 16, top: 26, row: 28 };
function laneX(flow, t) {
  const width = state.tab.size[0] - LANE.left - LANE.right;
  const clamped = Math.max(flow.start, Math.min(flow.end, t));
  return LANE.left + ((clamped - flow.start) / (flow.end - flow.start)) * width;
}
function drawLanes() {
  const flow = currentFlow();
  const lanes = $("lanes");
  lanes.replaceChildren();
  const legend = $("lane-legend");
  legend.replaceChildren();
  if (!flow || !flow.lanes) {
    lanes.style.display = "none";
    return;
  }
  lanes.style.display = "";
  const { rows, items, marks = [] } = flow.lanes;
  const width = state.tab.size[0];
  const height = LANE.top + rows.length * LANE.row + 8;
  lanes.setAttribute("viewBox", `0 0 ${width} ${height}`);
  const x = (t) => laneX(flow, t);
  const rowY = Object.fromEntries(rows.map((row, i) => [row.id, LANE.top + i * LANE.row]));
  const axis = svg("g", { class: "axis" });
  const step = flow.end - flow.start > 4000 ? 500 : 250;
  for (let t = Math.ceil(flow.start / step) * step; t <= flow.end; t += step) {
    axis.append(svg("line", { x1: x(t), x2: x(t), y1: 16, y2: height - 4 }));
    axis.append(svg("text", { x: x(t), y: 12 }, `${(t / 1000).toFixed(t % 1000 ? 1 : 0)} s`));
  }
  lanes.append(axis);
  rows.forEach((row, i) => {
    const y = LANE.top + i * LANE.row;
    lanes.append(svg("text", { class: "lane-label", x: 8, y: y + 17 }, row.label));
    lanes.append(
      svg("line", {
        class: "lane-rule",
        x1: LANE.left,
        x2: width - LANE.right,
        y1: y + LANE.row - 1,
        y2: y + LANE.row - 1,
      }),
    );
  });
  const bar = (row, from, to, className, title) => {
    if (from == null || to == null || to <= from) return;
    const rect = svg("rect", {
      class: `bar ${className}`,
      x: x(from),
      y: rowY[row] + 5,
      width: Math.max(1, x(to) - x(from)),
      height: LANE.row - 11,
    });
    rect.append(svg("title", {}, title));
    lanes.append(rect);
  };
  for (const item of items) {
    const who = item.who || item.row;
    if (item.input == null) {
      bar(
        item.row,
        item.from,
        item.to,
        `req who-${item.who || "none"}`,
        `${item.label}: ${item.who ? "a member's batch" : "idle poll"}, ${item.from}-${item.to} ms`,
      );
      continue;
    }
    const end = item.until ?? flow.end;
    bar(item.row, item.input, item.completed ?? end, `think who-${who}`, `${item.label}: thinking`);
    if (item.completed != null)
      bar(
        item.row,
        item.completed,
        item.sent ?? end,
        `wait who-${who}`,
        `${item.label}: finished, waiting to be sent`,
      );
    if (item.sent != null)
      bar(
        item.row,
        item.sent,
        item.applied ?? end,
        "engine",
        `${item.label}: sent, until the engine applied it`,
      );
    if (item.input === item.completed) {
      const tick = svg("line", {
        class: "mark",
        x1: x(item.input),
        x2: x(item.input),
        y1: rowY[item.row] + 3,
        y2: rowY[item.row] + LANE.row - 4,
      });
      tick.style.stroke = `var(--member-${who.toLowerCase()})`;
      tick.append(svg("title", {}, `${item.label}: started and finished at once`));
      lanes.append(tick);
    }
  }
  for (const mark of marks) {
    for (const at of [].concat(mark.at)) {
      const mx = x(at);
      const my = rowY[mark.row] + LANE.row / 2;
      let node;
      if (mark.kind === "applied")
        node = svg("line", { class: "mark", x1: mx, x2: mx, y1: my - 7, y2: my + 7 });
      else if (mark.kind === "discarded")
        node = svg("circle", { class: "mark discarded", cx: mx, cy: my, r: 5 });
      else
        node = svg("path", {
          class: "mark running",
          d: `M${mx},${my - 6} L${mx + 6},${my} L${mx},${my + 6} L${mx - 6},${my} Z`,
        });
      node.append(svg("title", {}, `${mark.kind} at ${at} ms`));
      lanes.append(node);
    }
  }
  lanes.append(
    svg("line", { id: "cursor", x1: x(state.time), x2: x(state.time), y1: 16, y2: height - 2 }),
  );
  lanes.onclick = (event) => {
    const box = lanes.getBoundingClientRect();
    const sx = ((event.clientX - box.left) / box.width) * width;
    const share = (sx - LANE.left) / (width - LANE.left - LANE.right);
    pause();
    setTime(flow.start + Math.max(0, Math.min(1, share)) * (flow.end - flow.start));
    writeHash();
  };
  const entries = [
    ["think who-A", "thinking (member colour)"],
    ["wait who-A", "finished, waiting to be sent"],
    ["engine", "sent, until the engine applied it"],
    ["req who-none", "idle poll (no member's batch)"],
  ];
  for (const [className, text] of entries) {
    const item = el("span");
    const sample = svg("svg", { width: 18, height: 9, class: "swatch" });
    sample.append(svg("rect", { class: `bar ${className}`, width: 18, height: 9 }));
    item.append(sample, text);
    legend.append(item);
  }
  const kinds = new Set(marks.map((mark) => mark.kind));
  if (kinds.has("applied")) legend.append(el("span", "| tick: request applied"));
  if (kinds.has("discarded")) legend.append(el("span", "o: call discarded at cleanup"));
  if (kinds.has("running at close"))
    legend.append(el("span", "\u25C6: call still running at cleanup"));
  legend.append(el("span", `Time axis: ${flow.clock}.`));
}

// Player.
function stepTimes(flow) {
  return [...new Set(flow.steps.map((step) => step.at))].sort((a, b) => a - b);
}
function setTime(t) {
  const flow = currentFlow();
  if (!flow) return;
  state.time = Math.max(flow.start, Math.min(flow.end, t));
  renderTime();
}
function tick(now) {
  state.loop = null;
  if (!state.playing) return;
  const flow = currentFlow();
  if (state.lastTick != null) {
    state.time += (now - state.lastTick) * state.speed;
    if (state.time >= flow.end) {
      state.time = flow.end;
      pause();
    }
  }
  state.lastTick = now;
  renderTime();
  if (state.playing) state.loop = requestAnimationFrame(tick);
}
function play() {
  const flow = currentFlow();
  if (!flow) return;
  if (state.time >= flow.end) state.time = flow.start;
  state.playing = true;
  state.lastTick = null;
  state.loop ??= requestAnimationFrame(tick);
  $("play").textContent = "Pause";
}
function pause() {
  state.playing = false;
  $("play").textContent = "Play";
  writeHash();
}
function stepBy(direction) {
  const flow = currentFlow();
  if (!flow) return;
  pause();
  const times = stepTimes(flow);
  const target =
    direction > 0
      ? (times.find((t) => t > state.time + 0.5) ?? flow.end)
      : ([...times].reverse().find((t) => t < state.time - 0.5) ?? flow.start);
  setTime(target);
  writeHash();
}
function renderTime() {
  const flow = currentFlow();
  if (!flow) return;
  drawDots();
  $("slider").value = state.time;
  $("time").textContent =
    `${(state.time / 1000).toFixed(2)} s ${flow.clock === "battle time" ? "battle" : "(illustrative)"}`;
  const cursor = $("cursor");
  if (cursor) {
    const x = laneX(flow, state.time);
    cursor.setAttribute("x1", x);
    cursor.setAttribute("x2", x);
  }
  const active = activeSteps(flow, state.time);
  const key = active.map((step) => flow.steps.indexOf(step)).join(",");
  if (key !== state.nowKey) {
    state.nowKey = key;
    renderNow(active);
  }
}

// Side panel.
function refList(refs, commit) {
  const list = el("ul", null, "refs");
  for (const ref of refs || []) {
    const item = el("li");
    const match = ref.match(/^([^\s:]+)(?::(\d+)(?:-(\d+))?)?(.*)$/);
    if (ref.startsWith("runs/") || !match) {
      item.append(el("span", `${ref} (local evidence, not in Git)`, "local"));
    } else {
      const [, path, first, last] = match;
      const link = el("a", ref);
      link.href = `${DIAGRAM.repo}/blob/${commit}/${path}${first ? `#L${first}${last ? `-L${last}` : ""}` : ""}`;
      link.target = "_blank";
      link.rel = "noopener";
      item.append(link);
    }
    list.append(item);
  }
  if (!(refs || []).length) list.append(el("li", "no source", "missing"));
  return list;
}
function restsList(rests, commit) {
  const box = el("div");
  for (const rest of rests || []) {
    const p = el("p", null, "rests");
    const link = el("a", `${rest.file} ${rest.name}`);
    link.href = `${DIAGRAM.repo}/blob/${commit}/${rest.file}#L${rest.line}`;
    link.target = "_blank";
    link.rel = "noopener";
    p.append(`rests on JUDGEMENT${rest.sure === false ? "?" : ""} `, link);
    box.append(p);
  }
  return box;
}
function statusBlock(status, commit) {
  const kind = statusKind(status);
  const wrap = el("div");
  const line = el("div", null, "status");
  line.append(
    el("span", null, `chip ${kind}`),
    el("span", statusText(status) || "no status", kind === "missing" ? "missing" : ""),
  );
  wrap.append(line);
  if (status && typeof status === "object") {
    if (status.refs) wrap.append(refList(status.refs, commit));
    if (status.rests) wrap.append(restsList(status.rests, commit));
  }
  return wrap;
}
function renderNow(active) {
  const now = $("now");
  if (!now) return;
  now.replaceChildren();
  const flow = currentFlow();
  if (!flow) return;
  if (!active.length) {
    now.append(el("p", "No step is active at this time. Press Play or the right arrow.", "hint"));
    return;
  }
  for (const step of active) {
    const div = el(
      "div",
      null,
      `step who-${step.who || (dotsOf(step).find((dot) => dot.who) || {}).who || "none"}`,
    );
    const until = step.every
      ? `${step.until} ms, repeating every ${step.every} ms`
      : `${step.until} ms`;
    div.append(el("div", `${step.at} to ${until}`, "when"), el("p", step.caption));
    div.append(refList(step.refs, state.tab.commit));
    if (step.rests) div.append(restsList(step.rests, state.tab.commit));
    now.append(div);
  }
}
function renderSelected(container) {
  const id = state.selected;
  const item = boxes[id] || wires[id];
  if (!item) return false;
  const commit = state.tab.commit;
  const isWire = Boolean(wires[id]);
  container.append(
    el("h3", isWire ? `${boxes[item.from].label} \u2192 ${boxes[item.to].label}` : item.label),
  );
  if (!isWire)
    container.append(el("p", [item.kind, item.where].filter(Boolean).join(", "), "meta"));
  container.append(el("h4", "Status"), statusBlock(item.status, commit));
  if (item.note) container.append(el("p", item.note));
  if (isWire) {
    const payload = el("p", null, "kv");
    payload.append(el("b", "Carries: "), item.payload || "");
    const sync = el("p", null, "kv");
    sync.append(el("b", "How: "), item.sync || "");
    container.append(payload, sync);
  }
  if (item.rests) container.append(el("h4", "Judgement calls"), restsList(item.rests, commit));
  container.append(el("h4", "Source"), refList(item.refs, commit));
  if (item.tab && tabById(item.tab)) {
    const open = el("button", `Open the ${tabById(item.tab).title} tab`);
    open.addEventListener("click", () => openTab(item.tab));
    container.append(open);
  } else if (item.tab) {
    container.append(el("p", "Its tab is not drawn yet.", "hint"));
  }
  return true;
}
function renderPanel() {
  const panel = $("panel");
  panel.replaceChildren();
  const tab = state.tab;
  const flow = currentFlow();
  panel.append(el("h2", tab.title));
  const meta = el("p", null, "meta");
  const commit = el("a", tab.commit);
  commit.href = `${DIAGRAM.repo}/tree/${tab.commit}`;
  commit.target = "_blank";
  commit.rel = "noopener";
  meta.append("Claims checked against the code at ", commit, ` on ${tab.checked}.`);
  panel.append(meta);
  if (flow) {
    panel.append(el("h4", "Flow"), el("p", flow.title));
    panel.append(
      el(
        "span",
        flow.timing,
        `badge ${flow.timing.startsWith("illustrative") ? "illustrative" : ""}`,
      ),
    );
    panel.append(el("p", `From: ${flow.source}.`, "meta"), el("p", flow.drawn, "meta"));
    if (flow.derived) panel.append(refList(flow.derived, tab.commit));
    panel.append(el("h4", "Now"));
    const now = el("div");
    now.id = "now";
    panel.append(now);
  }
  const selected = el("div");
  if (renderSelected(selected)) {
    panel.append(selected);
    const back = el("button", "Back to the tab notes");
    back.addEventListener("click", () => select(null));
    panel.append(back);
  } else {
    panel.append(el("h4", "About this tab"), el("p", tab.summary));
    for (const note of tab.notes || []) {
      const div = el("div", null, "step");
      div.append(el("p", note.text));
      if (note.status) div.append(statusBlock(note.status, tab.commit));
      div.append(refList(note.refs, tab.commit));
      if (note.rests) div.append(restsList(note.rests, tab.commit));
      panel.append(div);
    }
    panel.append(
      el("p", "Click a box or wire for what it carries, its status and its source.", "hint"),
    );
  }
  state.nowKey = null;
  if (flow) renderTime();
}
function markSelected() {
  document.querySelectorAll(".selected").forEach((node) => node.classList.remove("selected"));
  if (state.selected)
    document.querySelector(`[data-id="${state.selected}"]`)?.classList.add("selected");
}
function select(id) {
  state.selected = id;
  markSelected();
  renderPanel();
}

// Tabs, flows and the URL hash (#tab/flow/step).
function renderTabs() {
  const nav = $("tabs");
  nav.replaceChildren();
  for (const tab of DIAGRAM.tabs) {
    const button = el("button", tab.title);
    button.setAttribute("role", "tab");
    button.setAttribute("aria-selected", String(tab === state.tab));
    button.addEventListener("click", () => openTab(tab.id));
    nav.append(button);
  }
}
function renderFlows() {
  const flows = state.tab.flows || [];
  const holder = $("flows");
  holder.replaceChildren();
  for (const flow of flows) {
    const button = el("button", flow.title);
    button.setAttribute("aria-pressed", String(flow === currentFlow()));
    button.addEventListener("click", () => openFlow(flow.id));
    holder.append(button);
  }
  const player = $("player");
  player.style.display = flows.length ? "" : "none";
  const flow = currentFlow();
  if (!flow) return;
  $("slider").min = flow.start;
  $("slider").max = flow.end;
  state.speed = flow.speed || 0.25;
  $("speed").value = String(state.speed);
}
function renderLegend() {
  const legend = $("legend");
  legend.replaceChildren();
  for (const [kind, , text] of STATUSES) {
    const item = el("span");
    item.append(el("span", null, `chip ${kind}`), text);
    legend.append(item);
  }
  const shapes = el(
    "span",
    "Shapes: square corners process, side stripe thread, round agent, folded corner file, pill outside service or person; dashed and faded: planned.",
  );
  legend.append(shapes);
  const label = el("label");
  const box = el("input");
  box.type = "checkbox";
  box.checked = state.planned;
  box.addEventListener("change", () => {
    state.planned = box.checked;
    drawCanvas();
    drawDots();
  });
  label.append(box, " show planned");
  legend.append(label);
}
function openTab(id, flowId, stepIndex) {
  pause();
  state.tab = tabById(id) || DIAGRAM.tabs[0];
  state.flow = flowId || null;
  state.selected = null;
  renderAll(stepIndex);
}
function openFlow(id) {
  pause();
  state.flow = id;
  renderAll(0);
}
function renderAll(stepIndex) {
  const flow = currentFlow();
  state.flow = flow ? flow.id : null;
  if (flow) {
    const times = stepTimes(flow);
    state.time = times[stepIndex ?? 0] ?? flow.start;
  }
  renderTabs();
  renderFlows();
  drawCanvas();
  drawLanes();
  renderPanel();
  writeHash();
}
function writeHash() {
  if (!state.tab) return;
  const flow = currentFlow();
  let hash = `#${state.tab.id}`;
  if (flow) {
    const times = stepTimes(flow);
    let index = 0;
    times.forEach((t, i) => {
      if (t <= state.time) index = i;
    });
    hash += `/${flow.id}/${index}`;
  }
  if (location.hash !== hash) history.replaceState(null, "", hash);
}
function readHash() {
  const [id, flowId, step] = location.hash.slice(1).split("/");
  openTab(id || DIAGRAM.tabs[0].id, flowId, step ? Number(step) : 0);
}

$("play").addEventListener("click", () => (state.playing ? pause() : play()));
$("next").addEventListener("click", () => stepBy(1));
$("back").addEventListener("click", () => stepBy(-1));
$("speed").addEventListener("change", (event) => {
  state.speed = Number(event.target.value);
});
$("slider").addEventListener("input", (event) => {
  if (state.playing) pause();
  setTime(Number(event.target.value));
});
$("slider").addEventListener("change", writeHash);
document.addEventListener("keydown", (event) => {
  if (event.target.closest("input, select, textarea") || !currentFlow()) return;
  if (event.key === " ") {
    event.preventDefault();
    if (state.playing) pause();
    else play();
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    stepBy(1);
  } else if (event.key === "ArrowLeft") {
    event.preventDefault();
    stepBy(-1);
  }
});
window.addEventListener("hashchange", readHash); // the page's own writes use replaceState
renderLegend();
readHash();
</script>
</body>
</html>
